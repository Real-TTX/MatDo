<!DOCTYPE html>
<html lang="en" data-app="matdo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#d03d33" />
  <title>MatDo · Offline</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/matui/matui.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <main class="mat-auth">
    <div class="mat-auth__card">
      <div class="mat-auth__brand">
        <img class="md-brandmark md-brandmark--light" src="/img/logo/matdo-logo.svg" alt="MatDo" width="152" height="40" />
        <img class="md-brandmark md-brandmark--dark" src="/img/logo/matdo-logo-dark.svg" alt="MatDo" width="152" height="40" />
        <h1>Offline</h1>
        <p class="mat-muted" lang="en">No connection to MatDo. Your tasks are safe on the server – this page comes back as soon as the network does.</p>
        <p class="mat-muted" lang="de">Keine Verbindung zu MatDo. Deine Aufgaben sind sicher auf dem Server – die Seite ist wieder da, sobald das Netz zurück ist.</p>
      </div>
      <div class="mat-btn-row mat-btn-row--plain">
        <a class="mat-btn mat-btn--primary" href="/Today">Retry · Erneut versuchen</a>
      </div>
    </div>
  </main>
</body>
</html>
