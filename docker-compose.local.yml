# MatDo – Local (baut das Image aus diesem Ordner) mit pgAdmin
#   ./scripts/redeploy.ps1              (baut neu und startet den Stack: so wird jede Änderung getestet)
#   docker compose -f docker-compose.local.yml up -d --build
#   App:      http://localhost:6006
#   pgAdmin:  http://localhost:6007   (ohne Anmeldung; Datenbank-Passwort: matdo)
#   Postgres: localhost:6008          (für "dotnet run" außerhalb von Docker, siehe appsettings.Development.json)
name: matdo-local

services:
  web:
    build: .
    image: matdo:local
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "6008:5432"
    environment:
      POSTGRES_DB: matdo
      POSTGRES_USER: matdo
      POSTGRES_PASSWORD: matdo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matdo -d matdo"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "6007:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matdo.example.com
      PGADMIN_DEFAULT_PASSWORD: matdo
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatDo (local)", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matdo", "Username": "matdo", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:

# Ein festes Subnetz: auf einem Rechner mit vielen Stacks gehen Docker sonst die Adressbereiche aus
# ("all predefined address pools have been fully subnetted").
networks:
  default:
    ipam:
      config:
        - subnet: 10.253.66.0/24
